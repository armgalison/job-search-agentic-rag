# Builds the desktop app for Windows, Linux and macOS on every push to main (i.e. every merged PR),
# and on demand from the Actions tab. Each OS builds on its own runner, so npm installs that platform's
# native binaries (sharp, onnxruntime-node, better-sqlite3 prebuilds). Packages are unsigned.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            # Native Windows runner: the NSIS installer builds here (it needs Wine elsewhere)
            targets: --win nsis zip
          - os: ubuntu-latest
            platform: linux
            targets: --linux
          - os: macos-latest # Apple Silicon (onnxruntime-node has no Intel macOS binary)
            platform: mac
            targets: --mac
    runs-on: ${{ matrix.os }}
    env:
      # No code-signing certificates: never look for one in the keychain / environment
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npx electron-vite build
      - name: Package
        run: npx electron-builder ${{ matrix.targets }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: job-search-rag-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30
